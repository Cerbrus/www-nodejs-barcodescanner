name: Build images

on:
    push:
        branches: [master]
        paths-ignore:
            - 'docs/**'
            - '**.md'
            - '.github/dependabot.yml'
            - '.github/workflows/dependabot-helper.yml'
            - '.github/workflows/issue-investigator.yml'
            - '.github/workflows/pull-request-labels.yml'
            - '.github/workflows/registry-cleanup.yml'
            - '.github/workflows/release-train.yml'
            - '.github/workflows/release-train-on-approval.yml'
            - '.github/release-train/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/CODEOWNERS'
            - '.github/issue-investigator.md'
            - '.github/dependabot-helper.md'
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                description: Branch or commit to check instead of the one that started the run
                type: string
                required: false
                default: ''
            publish_commit:
                description: Publish the images under their commit alone, for the build of master to promote
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    packages: write

concurrency:
    group: build-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/cerbrus/barcodescanner

jobs:
    plan:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            built: ${{ steps.version.outputs.built }}
            commit: ${{ steps.version.outputs.commit }}
            promote: ${{ steps.train.outputs.found }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref }}
            - name: Work out the version
              id: version
              run: |
                  VERSION=$(bash .github/scripts/version.sh)
                  BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  COMMIT=$(git rev-parse HEAD)
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "built=$BUILT" >> "$GITHUB_OUTPUT"
                  echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
                  {
                      echo "## Version $VERSION"
                      echo
                      echo "| | |"
                      echo "|---|---|"
                      echo "| Commit | \`${COMMIT::7}\` |"
                      echo "| Built | $BUILT |"
                      if [ "$GITHUB_EVENT_NAME" = push ]; then
                          echo "| Published | images tagged latest and $VERSION, git tag v$VERSION |"
                      elif [ "${{ inputs.publish_commit }}" = true ]; then
                          echo "| Published | no: release train, images under their commit only |"
                      else
                          echo "| Published | no: pull request, build only |"
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "::notice title=Version::$VERSION"
            - name: Look for the images the release train built from this commit
              id: train
              if: github.event_name == 'push'
              env:
                  COMMIT: ${{ steps.version.outputs.commit }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "$GH_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
                  FOUND=true
                  for NAME in app agent; do
                      docker buildx imagetools inspect "$IMAGE_PREFIX-$NAME:$COMMIT" >/dev/null 2>&1 || FOUND=false
                  done
                  echo "found=$FOUND" >> "$GITHUB_OUTPUT"
                  if [ "$FOUND" = true ]; then
                      echo "::notice title=Release train::The train checked ${COMMIT::7} and built its images; they are published as they are."
                  fi

    checks:
        needs: plan
        if: needs.plan.outputs.promote != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: yarn
            - run: yarn install --immutable
            - run: yarn lint:all
            - run: yarn product-api:test
            - run: yarn product-api:test:integration
            - run: yarn product-front:test
            - run: yarn shared:test
            - name: Run the built app in a browser
              run: yarn e2e
            - name: Show the page of a failed browser test
              if: failure()
              run: cat /tmp/barcodescanner-e2e-results/*/error-context.md | head -200
            - name: Test the hardware agent
              run: python3 -m unittest discover -s apps/hardware-agent -p "test_*.py"
            - name: Check the shell scripts
              run: shellcheck deployment/*.sh .github/scripts/*.sh

    images:
        name: ${{ matrix.name }} image ${{ needs.plan.outputs.version }}
        needs: plan
        if: needs.plan.outputs.promote != 'true'
        runs-on: ubuntu-24.04-arm
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: app
                      context: .
                      file: Dockerfile
                    - name: agent
                      context: apps/hardware-agent
                      file: apps/hardware-agent/Dockerfile
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref }}

            - uses: actions/setup-node@v7
              if: matrix.name == 'app'
              with:
                  node-version: 26

            - name: Write the changelog into the web app
              if: matrix.name == 'app'
              run: node tools/changelog.mjs --upcoming "${{ needs.plan.outputs.version }}"

            - uses: docker/setup-buildx-action@v4

            - name: Log in to the registry
              if: github.event_name == 'push' || inputs.publish_commit == true
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  platforms: linux/arm64
                  push: ${{ github.event_name == 'push' || inputs.publish_commit == true }}
                  provenance: false
                  build-args: |
                      APP_VERSION=${{ needs.plan.outputs.version }}
                      APP_COMMIT=${{ needs.plan.outputs.commit }}
                      APP_BUILT=${{ needs.plan.outputs.built }}
                  tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:unchecked-${{ needs.plan.outputs.commit }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    publish:
        name: publish the images
        needs: [plan, checks, images]
        if: >-
            !cancelled() && needs.plan.result == 'success' &&
            (github.event_name == 'push' || inputs.publish_commit == true) &&
            (needs.plan.outputs.promote == 'true' ||
            (needs.checks.result == 'success' && needs.images.result == 'success'))
        runs-on: ubuntu-latest
        steps:
            - name: Log in to the registry
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Give the checked images their tags
              env:
                  VERSION: ${{ needs.plan.outputs.version }}
                  COMMIT: ${{ needs.plan.outputs.commit }}
                  PROMOTE: ${{ needs.plan.outputs.promote }}
              run: |
                  SOURCE="unchecked-$COMMIT"
                  TAGS=("$COMMIT")
                  if [ "$PROMOTE" = true ]; then
                      SOURCE=$COMMIT
                      TAGS=()
                  fi
                  if [ "$GITHUB_EVENT_NAME" = push ]; then
                      TAGS+=("$VERSION" latest)
                  fi

                  for NAME in app agent; do
                      docker buildx imagetools inspect "$IMAGE_PREFIX-$NAME:$SOURCE" >/dev/null
                  done
                  for NAME in app agent; do
                      ARGS=()
                      for TAG in "${TAGS[@]}"; do
                          ARGS+=(--tag "$IMAGE_PREFIX-$NAME:$TAG")
                      done
                      docker buildx imagetools create "${ARGS[@]}" "$IMAGE_PREFIX-$NAME:$SOURCE"
                  done

    tag:
        name: tag the release
        needs: [plan, publish]
        if: "!cancelled() && github.event_name == 'push' && needs.publish.result == 'success'"
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref }}
            - name: Tag the commit with its version and publish release notes
              env:
                  TAG: v${{ needs.plan.outputs.version }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                      echo "$TAG exists already"
                      exit 0
                  fi

                  PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
                  {
                      echo "Images: \`ghcr.io/cerbrus/barcodescanner-app:${TAG#v}\` and \`ghcr.io/cerbrus/barcodescanner-agent:${TAG#v}\`"
                      echo
                      echo "## Changes${PREVIOUS:+ since $PREVIOUS}"
                      echo
                      git log --no-merges --format='- %s (%h)' ${PREVIOUS:+"$PREVIOUS.."}"$GITHUB_SHA"
                  } > notes.md

                  git tag "$TAG" "$GITHUB_SHA"
                  git push origin "$TAG"
                  gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
            - name: 🏁 Tell the pull requests and their issues about the release
              env:
                  TAG: v${{ needs.plan.outputs.version }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
                  bash .github/scripts/release-train.sh announce "$TAG" "$PREVIOUS"
