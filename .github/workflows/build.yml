name: Build images

on:
    push:
        branches: [ master ]
    pull_request:

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/cerbrus/barcodescanner

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: 24
                    cache: yarn
            -   run: yarn install --immutable
            -   run: yarn lint:all
            -   run: yarn product-api:test
            -   run: yarn product-api:test:integration

    images:
        needs: checks
        runs-on: ubuntu-24.04-arm
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: app
                        context: .
                        file: Dockerfile
                    -   name: agent
                        context: apps/hardware-agent
                        file: apps/hardware-agent/Dockerfile
        steps:
            -   uses: actions/checkout@v4

            -   uses: docker/setup-buildx-action@v3

            -   name: Log in to the registry
                if: github.event_name == 'push'
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@v6
                with:
                    context: ${{ matrix.context }}
                    file: ${{ matrix.file }}
                    platforms: linux/arm64
                    push: ${{ github.event_name == 'push' }}
                    build-args: |
                        APP_VERSION=${{ github.sha }}
                    tags: |
                        ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
                        ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
                    cache-from: type=gha,scope=${{ matrix.name }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.name }}
