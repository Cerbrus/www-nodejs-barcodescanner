name: Build images

on:
    push:
        branches: [ master ]
        paths-ignore:
            - 'docs/**'
            - '**.md'
            - '.github/dependabot.yml'
            - '.github/workflows/dependabot-helper.yml'
    pull_request:

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/cerbrus/barcodescanner

jobs:
    checks:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            built: ${{ steps.version.outputs.built }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Work out the version
                id: version
                run: |
                    VERSION=$(bash .github/scripts/version.sh)
                    BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "built=$BUILT" >> "$GITHUB_OUTPUT"
                    {
                        echo "## Version $VERSION"
                        echo
                        echo "| | |"
                        echo "|---|---|"
                        echo "| Commit | \`${GITHUB_SHA::7}\` |"
                        echo "| Built | $BUILT |"
                        if [ "$GITHUB_EVENT_NAME" = push ]; then
                            echo "| Published | images tagged latest and $VERSION, git tag v$VERSION |"
                        else
                            echo "| Published | no: pull request, build only |"
                        fi
                    } >> "$GITHUB_STEP_SUMMARY"
                    echo "::notice title=Version::$VERSION"
            -   uses: actions/setup-node@v7
                with:
                    node-version: 25
                    cache: yarn
            -   run: yarn install --immutable
            -   run: yarn lint:all
            -   run: yarn product-api:test
            -   run: yarn product-api:test:integration
            -   run: yarn product-front:test
            -   name: Test the hardware agent
                run: python3 -m unittest discover -s apps/hardware-agent -p "test_*.py"
            -   name: Check the shell scripts
                run: shellcheck deployment/*.sh .github/scripts/*.sh

    images:
        name: ${{ matrix.name }} image ${{ needs.checks.outputs.version }}
        needs: checks
        runs-on: ubuntu-24.04-arm
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: app
                        context: .
                        file: Dockerfile
                    -   name: agent
                        context: apps/hardware-agent
                        file: apps/hardware-agent/Dockerfile
        steps:
            -   uses: actions/checkout@v7

            -   uses: docker/setup-buildx-action@v4

            -   name: Log in to the registry
                if: github.event_name == 'push'
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push
                uses: docker/build-push-action@v7
                with:
                    context: ${{ matrix.context }}
                    file: ${{ matrix.file }}
                    platforms: linux/arm64
                    push: ${{ github.event_name == 'push' }}
                    build-args: |
                        APP_VERSION=${{ needs.checks.outputs.version }}
                        APP_COMMIT=${{ github.sha }}
                        APP_BUILT=${{ needs.checks.outputs.built }}
                    tags: |
                        ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
                        ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ needs.checks.outputs.version }}
                        ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
                    cache-from: type=gha,scope=${{ matrix.name }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    tag:
        name: tag v${{ needs.checks.outputs.version }}
        needs: [ checks, images ]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Tag the commit with its version and publish release notes
                env:
                    TAG: v${{ needs.checks.outputs.version }}
                    GH_TOKEN: ${{ github.token }}
                run: |
                    if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
                        echo "$TAG exists already"
                        exit 0
                    fi

                    PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
                    {
                        echo "Images: \`ghcr.io/cerbrus/barcodescanner-app:${TAG#v}\` and \`ghcr.io/cerbrus/barcodescanner-agent:${TAG#v}\`"
                        echo
                        echo "## Changes${PREVIOUS:+ since $PREVIOUS}"
                        echo
                        git log --no-merges --format='- %s (%h)' ${PREVIOUS:+"$PREVIOUS.."}"$GITHUB_SHA"
                    } > notes.md

                    git tag "$TAG" "$GITHUB_SHA"
                    git push origin "$TAG"
                    gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
