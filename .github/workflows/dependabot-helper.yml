name: Dependabot helper

on:
    schedule:
        -   cron: '30 5 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dependabot-helper
    cancel-in-progress: false

env:
    MINIMUM_AGE_HOURS: 24
    PULL_REQUESTS_PER_RUN: 2
    ATTEMPTS_PER_PULL_REQUEST: 2

jobs:
    find:
        name: Find pull requests that need help
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            checks: read
            statuses: read
        outputs:
            numbers: ${{ steps.find.outputs.numbers }}
            count: ${{ steps.find.outputs.count }}
        steps:
            -   name: List Dependabot pull requests that are old enough and stuck
                id: find
                env:
                    GH_TOKEN: ${{ github.token }}
                    GH_REPO: ${{ github.repository }}
                run: |
                    gh pr list --author 'app/dependabot' --state open --limit 30 \
                        --json number,title,createdAt,mergeable,headRefOid,statusCheckRollup,comments > open.json

                    jq -c --argjson age "$MINIMUM_AGE_HOURS" --argjson attempts "$ATTEMPTS_PER_PULL_REQUEST" --argjson limit "$PULL_REQUESTS_PER_RUN" '
                        def checks: [.statusCheckRollup[]? | (.conclusion // .state // "")];
                        def helped: [.comments[]? | select(.body | contains("<!-- dependabot-helper"))];
                        [ .[]
                          | select((.createdAt | fromdateiso8601) < (now - $age * 3600))
                          | select(checks | all(. != "" and . != "PENDING" and . != "EXPECTED"))
                          | select(.mergeable == "CONFLICTING" or (checks | any(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT")))
                          | select((helped | length) < $attempts)
                          | select(.headRefOid as $head | helped | all(.body | contains($head) | not))
                          | .number
                        ] | .[:$limit]' open.json > numbers.json

                    echo "numbers=$(cat numbers.json)" >> "$GITHUB_OUTPUT"
                    echo "count=$(jq length numbers.json)" >> "$GITHUB_OUTPUT"
                    {
                        echo "Open Dependabot pull requests: $(jq length open.json)"
                        echo
                        echo "Need help now: $(cat numbers.json)"
                    } >> "$GITHUB_STEP_SUMMARY"

    help:
        name: Help pull request ${{ matrix.number }}
        needs: find
        if: needs.find.outputs.count != '0'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                number: ${{ fromJson(needs.find.outputs.numbers) }}
        permissions:
            contents: write
            pull-requests: write
            issues: write
            actions: read
            id-token: write
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0
            -   uses: actions/setup-node@v4
                with:
                    node-version: 24
            -   uses: anthropics/claude-code-action@v1
                with:
                    claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    claude_args: |
                        --model claude-sonnet-5-5
                        --max-turns 40
                        --allowedTools "Bash(git:*),Bash(gh pr:*),Bash(yarn:*),Bash(node:*),Bash(python3:*),Read,Edit,Write,Glob,Grep"
                    prompt: |
                        Tidy Dependabot pull request #${{ matrix.number }} of this repository so that its owner only has to press "merge".

                        Read CLAUDE.md first and follow its code style. Then read `.github/dependabot-helper.md` and follow it exactly.
