name: Build & Deploy

on:
    push:
        branches: [ develop, master ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6.0.2
            -   uses: actions/setup-node@v6.3.0
                with:
                    node-version: lts/*
                    cache: yarn
            -   run: yarn install --frozen-lockfile
            -   run: yarn product-api:build
            -   run: yarn product-front:build
            -   name: Upload build artifacts
                uses: actions/upload-artifact@v7.0.0
                with:
                    name: build-output
                    path: |
                        dist/
                        node_modules/
                        package.json
                        apps/supermarkt-connector/
                        apps/input-listener/

    deploy:
        needs: build
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        steps:
            -   name: Download build artifacts
                uses: actions/download-artifact@v8.0.1
                with:
                    name: build-output
                    path: staging

            -   name: Prepare product-api
                run: |
                    mkdir -p deploy/product-api
                    mv staging/dist/apps/product deploy/product-api/dist
                    mv staging/node_modules deploy/product-api/
                    mv staging/package.json deploy/product-api/

            -   name: Deploy product-api
                uses: burnett01/rsync-deployments@v8
                with:
                    switches: -avz --delete
                    path: deploy/product-api/
                    remote_path: /opt/product-api/
                    remote_host: ${{ secrets.DEPLOY_HOST }}
                    remote_user: deploy
                    remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

            -   name: Deploy product-front
                uses: burnett01/rsync-deployments@v8
                with:
                    switches: -avz --delete
                    path: staging/dist/apps/product-front/
                    remote_path: /opt/product-front/
                    remote_host: ${{ secrets.DEPLOY_HOST }}
                    remote_user: deploy
                    remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

            -   name: Deploy supermarkt-connector
                uses: burnett01/rsync-deployments@v8
                with:
                    switches: -avz --delete
                    path: staging/apps/supermarkt-connector/
                    remote_path: /opt/supermarkt-connector/
                    remote_host: ${{ secrets.DEPLOY_HOST }}
                    remote_user: deploy
                    remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

            -   name: Deploy input-listener
                uses: burnett01/rsync-deployments@v8
                with:
                    switches: -avz --delete
                    path: staging/apps/input-listener/
                    remote_path: /opt/input-listener/
                    remote_host: ${{ secrets.DEPLOY_HOST }}
                    remote_user: deploy
                    remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

            -   name: Install Python dependencies
                uses: appleboy/ssh-action@v1.2.5
                with:
                    host: ${{ secrets.DEPLOY_HOST }}
                    username: deploy
                    key: ${{ secrets.DEPLOY_SSH_KEY }}
                    script: |
                        sudo -u supermarkt-connector /opt/supermarkt-connector/.venv/bin/pip install -r /opt/supermarkt-connector/requirements.txt
                        sudo -u input-listener /opt/input-listener/.venv/bin/pip install -r /opt/input-listener/requirements.txt

            -   name: Restart services
                uses: appleboy/ssh-action@v1.2.5
                with:
                    host: ${{ secrets.DEPLOY_HOST }}
                    username: deploy
                    key: ${{ secrets.DEPLOY_SSH_KEY }}
                    script: |
                        sudo systemctl restart product-api
                        sudo systemctl restart supermarkt-connector
