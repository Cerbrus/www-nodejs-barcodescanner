name: Feature request
description: Something the app should do, or do differently
labels: [enhancement]
body:
    -   type: textarea
        id: what
        attributes:
            label: What is wished
            description: What you would like, and what it would help with.
        validations:
            required: true
    -   type: textarea
        id: where
        attributes:
            label: Where in the app
            description: The page or part of the app it belongs to, if any.
            placeholder: 'Page: #/list'
    -   type: input
        id: version
        attributes:
            label: Version
            description: At the bottom of the System page.
            placeholder: 1.1.40
