<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <title>Boodschappen</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boodschappen" />
    <meta name="application-name" content="Boodschappen" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png" />
    <link rel="manifest" href="assets/manifest.webmanifest" crossorigin="use-credentials" />

    <script>
        try {
            var theme = localStorage.getItem('theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (error) {}
        if (location.pathname !== '/') {
            history.replaceState(null, '', '/#' + location.pathname + location.search);
        }
    </script>
    <style>
        html { --boot-page: #f3f4f6; --boot-surface: #fff; --boot-line: #e2e5ea; background: var(--boot-page); }
        html[data-theme='dark'] { --boot-page: #111418; --boot-surface: #1a1f26; --boot-line: #2a313b; }
        @media (prefers-color-scheme: dark) {
            html:not([data-theme='light']) { --boot-page: #111418; --boot-surface: #1a1f26; --boot-line: #2a313b; }
        }
        .boot-bar {
            position: fixed; right: 0; bottom: 0; left: 0; height: calc(60px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--boot-line); background: var(--boot-surface);
        }
    </style>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
</head>
<body>
<app-root><div class="boot-bar"></div></app-root>
</body>
</html>
