<!doctype html>
<html lang="nl">
    <head>
        <meta charset="utf-8" />
        <title>Boodschappen</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#f3f4f6" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Boodschappen" />
        <meta name="application-name" content="Boodschappen" />
        <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png" />
        <link
            rel="apple-touch-startup-image"
            media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"
            href="assets/icons/launch-1170x2532-light.png"
        />
        <link
            rel="apple-touch-startup-image"
            media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"
            href="assets/icons/launch-1170x2532-dark.png"
        />
        <link rel="manifest" href="assets/manifest.webmanifest" crossorigin="use-credentials" />

        <script>
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.dataset.theme = theme;
                }
                var skin = localStorage.getItem('shownSkin') || localStorage.getItem('skin');
                if (skin && skin !== 'default' && /^[a-z]+$/.test(skin)) {
                    document.documentElement.dataset.skin = skin;
                }
            } catch (error) {}
            if (location.pathname !== '/') {
                history.replaceState(null, '', '/#' + location.pathname + location.search);
            }
        </script>
        <style>
            html {
                --boot-page: light-dark(#f3f4f6, #111418);
                --boot-surface: light-dark(#fff, #1a1f26);
                --boot-line: light-dark(#e2e5ea, #2a313b);
                background: var(--boot-page);
                color-scheme: light dark;
            }
            html[data-theme='light'] {
                color-scheme: light;
            }
            html[data-theme='dark'] {
                color-scheme: dark;
            }
            html[data-skin='contrast'] {
                --boot-page: light-dark(#fff, #000);
                --boot-surface: light-dark(#fff, #000);
                --boot-line: light-dark(#000, #fff);
            }
            html[data-skin='darcula'] {
                --boot-page: light-dark(#f2f2f2, #2b2b2b);
                --boot-surface: light-dark(#fff, #3c3f41);
                --boot-line: light-dark(#d3d5db, #555);
            }
            html[data-skin='solarized'] {
                --boot-page: light-dark(#eee8d5, #002b36);
                --boot-surface: light-dark(#fdf6e3, #073642);
                --boot-line: light-dark(#d9d2bd, #164450);
            }

            html[data-skin='christmas'] {

                --boot-surface: light-dark(#fff, #143021);
                --boot-line: light-dark(#d5e3d6, #24503a);
            }
            .boot-bar {
                position: fixed;
                right: 0;
                bottom: 0;
                left: 0;
                height: calc(60px + env(safe-area-inset-bottom));
                border-top: 1px solid var(--boot-line);
                background: var(--boot-surface);
            }
        </style>
    </head>
    <body>
        <app-root><div class="boot-bar"></div></app-root>
    </body>
</html>
