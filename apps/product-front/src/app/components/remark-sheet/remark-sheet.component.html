@if (remarks.draft(); as draft) {
    <app-sheet (closed)="close()">
        <h2 class="page-title">{{ 'remark.title' | translate }}</h2>

        <div class="segments wide">
            @for (option of kinds; track option) {
                <button
                    type="button"
                    class="segment"
                    [class.chosen]="kind() === option"
                    [attr.aria-pressed]="kind() === option"
                    (click)="kind.set(option)"
                >
                    <i class="material-symbols-outlined">{{ icons[option] }}</i>
                    {{ 'remark.kind.' + option | translate }}
                </button>
            }
        </div>

        @if (draft.target; as target) {
            <p class="about">
                <i class="material-symbols-outlined">ads_click</i>
                <span
                    >{{ 'remark.about' | translate }}:
                    {{ target.label || target.text || target.component || target.path }}</span
                >
            </p>
        }

        <label class="field-label" for="remark-text">{{ 'remark.text.' + kind() | translate }}</label>
        <textarea
            id="remark-text"
            class="field"
            rows="5"
            maxlength="2000"
            [ngModel]="text()"
            (ngModelChange)="text.set($event)"
            (keydown)="onKey($event)"
        ></textarea>

        <div class="mt-3 flex gap-2">
            <button
                type="button"
                class="btn basis-0 grow"
                [attr.aria-label]="'remark.closeKeep' | translate"
                (click)="close()"
            >
                <i class="material-symbols-outlined">bottom_panel_close</i>
            </button>
            <button
                type="button"
                class="btn danger basis-0 grow"
                [attr.aria-label]="'remark.closeClear' | translate"
                (click)="leave(true)"
            >
                <i class="material-symbols-outlined">delete</i>
            </button>
            <button
                type="button"
                class="btn primary basis-0 grow"
                [attr.aria-label]="'remark.send' | translate"
                [disabled]="!canSend()"
                (click)="send()"
            >
                <i class="material-symbols-outlined">send</i>
            </button>
        </div>
    </app-sheet>
}
