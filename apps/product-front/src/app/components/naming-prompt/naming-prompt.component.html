<app-sheet (closed)="closed.emit({ kind: 'later' })">
    <h2 class="page-title">{{ 'naming.title' | translate }}</h2>
    <p class="muted font-mono text-sm">{{ code() }}</p>

    <div class="mt-3 flex flex-col gap-2">
        @for (suggestion of suggestions(); track suggestion.connectorId) {
            <button
                type="button"
                class="card flex items-center gap-3 text-left"
                [class.selected]="search() === suggestion.title"
                [attr.aria-pressed]="search() === suggestion.title"
                (click)="useSuggestion(suggestion)"
            >
                @if (suggestion.imageUrl) {
                    <img class="h-14 w-14 rounded-lg bg-white object-contain" [src]="suggestion.imageUrl" alt="" />
                }
                <span class="grow">
                    <span class="block font-semibold">{{ suggestion.title }}</span>
                    <span class="muted block text-sm">
                        {{ suggestion.brand }}
                        @if (suggestion.brand && suggestion.category) {
                            ·
                        }
                        {{ suggestion.category }}
                    </span>
                </span>
                @if (search() === suggestion.title) {
                    <i class="material-symbols-outlined" style="color: var(--accent)">check_circle</i>
                }
                @if (connectors[suggestion.connectorId]; as connector) {
                    <img class="h-6 w-6 shrink-0 rounded object-contain" [src]="connector.logo" [alt]="connector.name" [title]="connector.name" />
                } @else {
                    <span class="muted text-xs uppercase">{{ suggestion.connectorId }}</span>
                }
            </button>
        } @empty {
            <p class="muted text-sm">
                {{ (lookupPending() ? 'naming.lookingUp' : 'naming.noSuggestions') | translate }}
            </p>
        }
    </div>

    @if (newName(); as name) {
        <div class="card mt-3">
            <app-new-item-form
                submitIcon="add_link"
                [initialName]="name"
                [hint]="suggestionText()"
                [submitLabel]="'naming.createAndLink' | translate"
                (created)="choose($event)"
                (cancelled)="newName.set(undefined)"
            />
        </div>
    } @else {
        <span class="field-label">{{ 'naming.searchLabel' | translate }}</span>
        <app-item-autocomplete
            [placeholder]="'naming.searchPlaceholder' | translate"
            [allowCreate]="true"
            [(text)]="search"
            (picked)="choose($event)"
            (create)="newName.set($event)"
        />
    }

    <div class="mt-4 flex gap-2">
        <button type="button" class="btn basis-0 grow" [disabled]="busy()" (click)="closed.emit({ kind: 'later' })">
            <i class="material-symbols-outlined">schedule</i>
            {{ 'naming.later' | translate }}
        </button>
        <button type="button" class="btn danger basis-0 grow" [disabled]="busy()" (click)="discard()">
            <i class="material-symbols-outlined">undo</i>
            {{ 'naming.discard' | translate }}
        </button>
    </div>
</app-sheet>
