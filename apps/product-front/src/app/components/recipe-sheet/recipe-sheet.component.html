<app-sheet (closed)="closed.emit()">
    <h2 class="page-title">{{ name() }}</h2>
    <p class="muted -mt-2 mb-2 text-sm">{{ 'recipe.sheetHint' | translate }}</p>

    <div class="flex flex-col">
        @for (row of rows(); track row.index) {
            @if (row.item; as item) {
                <label class="choice">
                    <input
                        type="checkbox"
                        [id]="'recipe-choice-' + row.index"
                        [checked]="!unticked().has(row.index)"
                        (change)="toggle(row.index)"
                    />
                    <span class="choice-icon"><app-item-icon [item]="item" /></span>
                    <span class="grow">
                        {{ item.name }}
                        @if (row.ingredient.note) {
                            <span class="muted block text-xs">{{ row.ingredient.note }}</span>
                        }
                    </span>
                    @if (row.ingredient.quantity > 1) {
                        <span class="font-bold">× {{ row.ingredient.quantity }}</span>
                    }
                </label>
            } @else {
                <div class="choice unknown">
                    <span class="grow">
                        {{ 'recipe.unknownProduct' | translate: { id: row.ingredient.catalogItemId } }}
                        @if (row.ingredient.note) {
                            <span class="block text-xs">{{ row.ingredient.note }}</span>
                        }
                    </span>
                </div>
            }
        }
    </div>

    <div class="mt-4 flex gap-2">
        <button
            type="button"
            class="btn primary basis-0 grow"
            [disabled]="!chosen().length"
            (click)="confirmed.emit(chosen())"
        >
            <i class="material-symbols-outlined">add_shopping_cart</i>
            {{ 'recipe.addChosen' | translate: { count: chosen().length } }}
        </button>
        <button type="button" class="btn" (click)="closed.emit()">
            <i class="material-symbols-outlined">close</i>
            {{ 'common.cancel' | translate }}
        </button>
    </div>
</app-sheet>
