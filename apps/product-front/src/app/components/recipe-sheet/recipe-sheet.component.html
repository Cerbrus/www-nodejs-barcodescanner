<app-sheet (closed)="closed.emit()">
    <h2 class="page-title">{{ name() }}</h2>

    <div class="choices">
        @for (row of rows(); track row.index) {
            @if (row.item; as item) {
                <label class="choice">
                    <input
                        type="checkbox"
                        [id]="'recipe-choice-' + row.index"
                        [checked]="!unticked().has(row.index)"
                        (change)="toggle(row.index)"
                    />
                    <span class="choice-icon"><app-item-icon [item]="item" /></span>
                    <span class="choice-name">{{ item.name }}</span>
                    @if (row.ingredient.note) {
                        <span class="choice-note">{{ row.ingredient.note }}</span>
                    }
                    @if (row.ingredient.quantity > 1) {
                        <span class="choice-quantity">× {{ row.ingredient.quantity }}</span>
                    }
                </label>
            } @else {
                <div class="choice unknown">
                    <span class="choice-name">
                        {{ 'recipe.unknownProduct' | translate: { id: row.ingredient.catalogItemId } }}
                    </span>
                    @if (row.ingredient.note) {
                        <span class="choice-note">{{ row.ingredient.note }}</span>
                    }
                </div>
            }
        }
    </div>

    @if (savable()) {
        <label class="keep">
            <input type="checkbox" id="recipe-keep" [checked]="save()" (change)="save.set(!save())" />
            {{ 'recipe.keep' | translate }}
        </label>
    }

    <div class="mt-4 flex gap-2">
        <button
            type="button"
            class="btn primary basis-0 grow"
            [disabled]="!chosen().length"
            (click)="confirmed.emit({ ingredients: chosen(), save: savable() && save() })"
        >
            <i class="material-symbols-outlined">add_shopping_cart</i>
            {{ 'recipe.products' | translate: { count: chosen().length } }}
        </button>
        <button type="button" class="btn" [attr.aria-label]="'common.cancel' | translate" (click)="closed.emit()">
            <i class="material-symbols-outlined">close</i>
        </button>
    </div>
</app-sheet>
