@for (page of pages(); track $index) {
    <div class="leaf">
        @for (mark of marks; track $index) {
            <span
                class="mark"
                [style.left.mm]="mark.left"
                [style.top.mm]="mark.top"
                [style.width.mm]="mark.width"
                [style.height.mm]="mark.height"
            ></span>
        }
        <div class="cells">
            @for (recipe of page; track recipe.id) {
                <div class="cell">
                    <app-recipe-code class="cell-code" [recipe]="recipe" />
                    <span class="cell-name">{{ recipe.name }}</span>
                </div>
            }
        </div>
    </div>
}
