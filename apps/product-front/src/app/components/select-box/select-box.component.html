<form class="mx-auto">
    <select #select (change)="onChange(select.value)" class="input">
        @if (!groupBySettings) { @for (option of options; track option.id) {
        <option [value]="option.id" [selected]="option.id === selected?.id">
            {{ option.label ? (option.label | async) : option.id }}
        </option>
        } } @if (groupBySettings) { @for (group of groupedOptions; track group.label) {
        <optgroup [label]="group.label | translate">
            @for (option of group.options; track option.id) {
            <option [value]="option.id" [selected]="option.id === selected?.id">
                {{ option.label ? (option.label | async) : option.id }}
            </option>
            }
        </optgroup>
        } }
    </select>
    <i class="material-symbols-outlined text-zinc-500 text-lg absolute top-[50%] right-4 translate-y-[-50%]"
        >expand_more</i
    >
</form>
