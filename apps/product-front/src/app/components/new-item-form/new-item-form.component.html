<div class="flex items-end gap-3">
    <button
        type="button"
        class="icon-choice h-16 w-16 shrink-0 rounded-2xl p-2"
        style="background: var(--tile-neutral); color: var(--tile-text)"
        [attr.aria-label]="'item.chooseIcon' | translate"
        (click)="pickingIcon.set(true)"
    >
        <app-item-icon [item]="preview()" />
        <i class="material-symbols-outlined icon-choice-edit">edit</i>
    </button>
    <div class="grow">
        <label class="field-label mt-0" for="new-item-name">{{ 'item.name' | translate }}</label>
        <input
            id="new-item-name"
            class="field"
            type="text"
            maxlength="80"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
        />
    </div>
</div>

<label class="field-label" for="new-item-section">{{ 'item.section' | translate }}</label>
<select id="new-item-section" class="field" [ngModel]="sectionId()" (ngModelChange)="sectionId.set($event)">
    @for (section of store.sections(); track section.id) {
        <option [value]="section.id">{{ section.emoji }} {{ section.name }}</option>
    }
</select>

<div class="flex items-end gap-2">
    <div class="w-24">
        <label class="field-label" for="new-item-emoji">{{ 'item.emoji' | translate }}</label>
        <input
            id="new-item-emoji"
            class="field"
            type="text"
            maxlength="8"
            [ngModel]="emoji()"
            (ngModelChange)="emoji.set($event)"
        />
    </div>

    <button
        [attr.aria-label]="'common.cancel' | translate"
        type="button"
        class="btn"
        [disabled]="busy()"
        (click)="cancelled.emit()"
    >
        <i class="material-symbols-outlined">undo</i>
    </button>
    <button
        [attr.aria-label]="submitLabel()"
        type="button"
        class="btn primary grow"
        [disabled]="busy() || !name().trim() || !sectionId()"
        (click)="create()"
    >
        <i class="material-symbols-outlined">{{ submitIcon() }}</i>
    </button>
</div>

@if (pickingIcon()) {
    <app-icon-picker [selected]="icon()" (picked)="chooseIcon($event)" (closed)="pickingIcon.set(false)" />
}
