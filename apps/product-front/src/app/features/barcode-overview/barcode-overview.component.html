<div class="flex flex-col gap-2 p-2">
    <label class="flex w-80 flex-row gap-2">
        <span>Width:</span>
        <input type="range" class="grow" [(ngModel)]="width" [min]="0" [max]="1000" />
        <span>{{ width }}</span>
    </label>
    <label class="flex w-80 flex-row gap-2">
        <span>Height:</span>
        <input type="range" class="grow" [(ngModel)]="height" [min]="0" [max]="1000" [disabled]="lockRatio" />
        <span>{{ height }}</span>
    </label>
    <label class="flex w-80 flex-row gap-2">
        <span>Lock ratio:</span>
        <input type="checkbox" [(ngModel)]="lockRatio" />
        <span class="grow text-right">{{ lockRatio ? 'Locked' : 'Unlocked' }}</span>
    </label>
    <app-barcode [barcode]="3387390321074" [width]="width" [height]="height" [lockRatio]="lockRatio" />
</div>
